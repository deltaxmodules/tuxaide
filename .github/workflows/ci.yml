name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning hook.sh install.sh setup.sh uninstall.sh scripts/render-packaging.sh scripts/demo-video.sh scripts/demo/entrypoint.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }    # oldest supported (macOS's system python3)
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest,  python: "3.12" }   # zsh only: macOS bash 3.2 has no not-found hook
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: pip install pytest
      - run: python -m pytest -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and install it with pipx
        run: |
          pipx run build --wheel --outdir dist
          pipx install dist/*.whl
          tuxaide --version
          HOME="$(mktemp -d)" tuxaide setup --yes --no-rag --shell bash --no-doctor
      - name: Render the Homebrew formula and PKGBUILD
        run: |
          git archive --prefix=tuxaide-ci/ -o /tmp/t.tar.gz HEAD
          scripts/render-packaging.sh 0.0.0 file:///tmp/t.tar.gz /tmp/out
          ruby -c /tmp/out/tuxaide.rb
          bash -n /tmp/out/PKGBUILD

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the manual (fails on a broken page)
        working-directory: site
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund vitepress@1.6.4
          npx vitepress build .
