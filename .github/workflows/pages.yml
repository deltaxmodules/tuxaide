# The manual (site/) on GitHub Pages: https://deltaxmodules.github.io/tuxaide/
# Published with each release, so the manual matches the version people install;
# run it by hand (workflow_dispatch) to publish fixes in between.
name: Manual
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --no-audit --no-fund vitepress@1.6.4
        working-directory: site
      - run: npx vitepress build .
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
